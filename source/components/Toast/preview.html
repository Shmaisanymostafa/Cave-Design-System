<!-- @dsCard group="Feedback" height=720 subtitle="Success, error and info toasts with actions; Light, Dark, Black" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}html{overflow-y:auto}body{overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
img,svg{max-width:100%}
body{background:var(--surface);color:var(--ink);font:14px/20px var(--ui-font)}
.pad{padding:var(--space-4)}
.row{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.dark{background:var(--surface);color:var(--ink)}
.cap{margin:0 0 var(--space-2);color:var(--ink-muted);font:500 12px/16px var(--ui-font)}

</style></head><body>
<div class="pad"><div class="col" style="align-items:flex-start">
<div class="cv-toast cv-toast--success"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Product saved.</div>
<div class="cv-toast cv-toast--error"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></span>Could not save. Check your connection.<button class="cv-toast__action">Retry</button></div>
<div class="cv-toast"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg></span>Order archived.<button class="cv-toast__action">Undo</button></div>
</div></div><div class="dark pad" data-theme="dark"><div class="col" style="align-items:flex-start">
<div class="cv-toast cv-toast--success"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Product saved.</div>
<div class="cv-toast cv-toast--error"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></span>Could not save. Check your connection.<button class="cv-toast__action">Retry</button></div>
<div class="cv-toast"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg></span>Order archived.<button class="cv-toast__action">Undo</button></div>
</div></div><div class="dark pad" data-theme="black"><div class="col" style="align-items:flex-start">
<div class="cv-toast cv-toast--success"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Product saved.</div>
<div class="cv-toast cv-toast--error"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></span>Could not save. Check your connection.<button class="cv-toast__action">Retry</button></div>
<div class="cv-toast"><span class="cv-toast__icon"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg></span>Order archived.<button class="cv-toast__action">Undo</button></div>
</div></div>
</body></html>
