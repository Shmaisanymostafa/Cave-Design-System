<!-- @dsCard group="Forms" height=470 subtitle="Label, helper, error, disabled; LTR values in RTL" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}
*,*::before,*::after{box-sizing:border-box}
img,svg{max-width:100%}
body{background:var(--surface);color:var(--ink);font:14px/20px var(--ui-font)}
.pad{padding:var(--space-4)}
.row{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.dark{background:var(--surface);color:var(--ink)}
.cap{margin:0 0 var(--space-2);color:var(--ink-muted);font:500 12px/16px var(--ui-font)}

</style></head><body>
<div class="pad"><div class="col" style="max-width:360px;width:100%">
  <div class="cv-field"><label class="cv-label" for="a">Product name</label><input id="a" class="cv-input" value="Olive oil 1L"><span class="cv-help">Shown on receipts and the storefront.</span></div>
  <div class="cv-field"><label class="cv-label" for="b">Phone</label><input id="b" class="cv-input cv-ltr" value="+961 70 185 306" aria-invalid="true"><span class="cv-error"><svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5v.01"/><path d="M10.3 4.6L3.4 17a2 2 0 001.7 3h13.8a2 2 0 001.7-3L13.7 4.6a2 2 0 00-3.4 0z"/></svg>Enter a valid phone number.</span></div>
  <div class="cv-field"><label class="cv-label" for="c">Notes</label><textarea id="c" class="cv-input" placeholder="Optional"></textarea></div>
  <div class="cv-field"><label class="cv-label" for="d">Barcode</label><input id="d" class="cv-input" value="Locked" disabled></div>
</div></div>
</body></html>
