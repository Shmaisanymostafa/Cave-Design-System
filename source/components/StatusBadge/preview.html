<!-- @dsCard group="Data" height=330 subtitle="Neutral, brand, success, warning, error, info; Light, Dark, Black" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}
*,*::before,*::after{box-sizing:border-box}
img,svg{max-width:100%}
body{background:var(--surface);color:var(--ink);font:14px/20px var(--ui-font)}
.pad{padding:var(--space-4)}
.row{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.dark{background:var(--surface);color:var(--ink)}
.cap{margin:0 0 var(--space-2);color:var(--ink-muted);font:500 12px/16px var(--ui-font)}

</style></head><body>
<div class="pad"><div class="row">
  <span class="cv-badge">Draft</span>
  <span class="cv-badge cv-badge--brand">Featured</span>
  <span class="cv-badge cv-badge--success">Paid</span>
  <span class="cv-badge cv-badge--warning">Low stock</span>
  <span class="cv-badge cv-badge--error">Overdue</span>
  <span class="cv-badge cv-badge--info">In progress</span>
</div></div><div class="dark pad" data-theme="dark"><div class="row">
  <span class="cv-badge">Draft</span>
  <span class="cv-badge cv-badge--brand">Featured</span>
  <span class="cv-badge cv-badge--success">Paid</span>
  <span class="cv-badge cv-badge--warning">Low stock</span>
  <span class="cv-badge cv-badge--error">Overdue</span>
  <span class="cv-badge cv-badge--info">In progress</span>
</div></div><div class="dark pad" data-theme="black"><div class="row">
  <span class="cv-badge">Draft</span>
  <span class="cv-badge cv-badge--brand">Featured</span>
  <span class="cv-badge cv-badge--success">Paid</span>
  <span class="cv-badge cv-badge--warning">Low stock</span>
  <span class="cv-badge cv-badge--error">Overdue</span>
  <span class="cv-badge cv-badge--info">In progress</span>
</div></div>
</body></html>
