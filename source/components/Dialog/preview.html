<!-- @dsCard group="Overlays" height=420 subtitle="Confirm dialog on a scrim" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0}
*,*::before,*::after{box-sizing:border-box}
img,svg{max-width:100%}
body{background:var(--surface);color:var(--ink);font:14px/20px var(--ui-font)}
.pad{padding:var(--space-4)}
.row{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.dark{background:var(--surface);color:var(--ink)}
.cap{margin:0 0 var(--space-2);color:var(--ink-muted);font:500 12px/16px var(--ui-font)}

</style></head><body>
<div class="cv-scrim" style="padding:var(--space-4)"><div class="cv-dialog" role="dialog" aria-modal="true" aria-labelledby="t1">
<h2 id="t1" class="cv-dialog__title">Delete this product?</h2>
<p class="cv-dialog__body">Olive oil 1L will be removed from your catalogue and storefront. Past orders keep their records. This cannot be undone.</p>
<div class="cv-dialog__actions"><button class="cv-btn cv-btn--secondary">Cancel</button><button class="cv-btn cv-btn--danger">Delete product</button></div></div></div>
</body></html>
