<!-- blocks: teal 240x320 (x480), deep-teal 240x224 (x720,y96), mist 240x96 (x720,y0); half the cover, bleeding top, right and bottom.
     arrangement: one tall slab beside a stacked pair, flush, no gaps, no radius (the marks inside carry the curves).
     pattern: literal motif, nested cave arches (r 48/96/144/192, stroke space-2) springing from the base at x720 over both blocks, plus a mist half-disc opening r24: the layers of the symbol, chosen because the brand is a cave.
     logo: the Cave symbol (colour on light, white on dark) above the name at x52 (the ink edge of the C), 60px tall; the one picture on the cover, because it is the brand's real mark.
     tagline: x60, 8px (space-2) in from the name so it never reads as starting behind the C.
     steps: pitch 48 = 6 x space-2, stroke space-2, name 120px Hero at x48, tagline 14px. -->
