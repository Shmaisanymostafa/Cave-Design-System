name: cave_ui_example
publish_to: none
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cave_ui:
    path: ../
flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
    - family: Almarai
      fonts:
        - asset: fonts/Almarai-Regular.ttf
        - asset: fonts/Almarai-Bold.ttf
          weight: 700
